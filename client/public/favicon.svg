<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Green rounded background -->
  <rect width="32" height="32" rx="7" fill="#2da44e"/>

  <!-- Bar chart bars (white), left to right increasing height -->
  <!-- Left bar (short) -->
  <rect x="6" y="19" width="5" height="7" rx="1.5" fill="white" opacity="0.9"/>
  <!-- Middle bar (medium) -->
  <rect x="13.5" y="13" width="5" height="13" rx="1.5" fill="white"/>
  <!-- Right bar (tall) -->
  <rect x="21" y="7" width="5" height="19" rx="1.5" fill="white" opacity="0.9"/>

  <!-- Subtle line at top of middle and right bars for depth -->
  <rect x="13.5" y="13" width="5" height="1.5" rx="0.75" fill="white" opacity="0.4"/>
  <rect x="21" y="7" width="5" height="1.5" rx="0.75" fill="white" opacity="0.4"/>
</svg>
