name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server — lint, test, build check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Validate Prisma schema
        working-directory: server
        run: npx prisma validate

      - name: Run tests
        working-directory: server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/devtrack_test
          GITHUB_CLIENT_ID: test_client_id
          GITHUB_CLIENT_SECRET: test_client_secret
          SESSION_SECRET: test_session_secret_must_be_at_least_32_chars_long
          ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY || 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' }}
          FRONTEND_URL: http://localhost:5173
          PORT: "4000"
        run: npm test

      - name: Security audit
        working-directory: server
        run: npm audit --audit-level=high
        continue-on-error: true

  client:
    name: Client — lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint
        continue-on-error: true

      - name: Build
        working-directory: client
        env:
          VITE_API_URL: http://localhost:4000
        run: npm run build

      - name: Security audit
        working-directory: client
        run: npm audit --audit-level=high
        continue-on-error: true

  post-deploy-health:
    name: Post-deploy health check
    runs-on: ubuntu-latest
    needs: [server, client]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Health check
        run: |
          echo "Post-deploy health check placeholder."
          echo "In production: curl -f https://api.devtrack.io/api/v1/health"
          # Uncomment and update when deployed:
          # curl -f --retry 5 --retry-delay 10 https://your-render-url.onrender.com/api/v1/health
